type Flight {
	PK: ID!
	SK: String!
	flightNumber: String!
	airline: String!
	price: Float!
	origin: String!
	destination: String!
	departureDate: String!
	departureTime: String!
	arrivalDate: String!
	arrivalTime: String!
	clientNames: String!
	createdAt: AWSDateTime!
	updatedAt: AWSDateTime!
}

input FlightInput {
	flightNumber: String!
	airline: String!
	price: Float!
	origin: String!
	destination: String!
	departureDate: String!
	departureTime: String!
	arrivalDate: String!
	arrivalTime: String!
}

type Query {
	getFlights(flight: FlightInputGet!): String!
	getUserFlights(username: String!): [Flight!]!
}
input FlightInputGet {
	name: String!
}

type Mutation {
	addFlight(flight: FlightInput!): Flight!
	updateFlight(flight: FlightInput!): Flight!
	deleteFlight(flightNumber: String!): Boolean!
}

schema {
	query: Query
	mutation: Mutation
}
