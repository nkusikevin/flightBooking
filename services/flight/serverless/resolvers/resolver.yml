appSync:
  resolvers:
    getFlights:
      type: Query
      field: getFlights
      kind: UNIT
      dataSource:
        type: AWS_LAMBDA
        config:
          functionArn: !Sub
            - arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:flight-${stage}-getFlights
            - { stage: "${opt:stage, self:provider.stage, 'dev'}" }
